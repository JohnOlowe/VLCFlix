<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0b0b0f" />
<title>VLCFlix</title>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0f'/%3E%3Cpath d='M6 9l6.5 15L19 9' fill='none' stroke='%23ff8800' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M22 9v15' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4.5v15l14-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9.2 18.3 3.4 12.5l1.7-1.7 4.1 4.1 9.7-9.7 1.7 1.7z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><path d="M11 9.5h2v10h-2zM11 4.5h2v2.6h-2z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6zm0-6.2 1.5 2.6 2.9-.6 1 2.8 2.8 1-.6 2.9L22 12l-2.4 1.1.6 2.9-2.8 1-1 2.8-2.9-.6L12 22l-1.5-2.8-2.9.6-1-2.8-2.8-1 .6-2.9L2 12l2.4-1.1-.6-2.9 2.8-1 1-2.8 2.9.6z" opacity=".92"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4 1.6-1.6L11.2 12 17 6.2z"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M8.6 4.6 16 12l-7.4 7.4-1.6-1.6L12.8 12 7 6.2z"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h4L13 5v14L8 14.5H4zM16 8.4a5 5 0 0 1 0 7.2l-1.4-1.4a3 3 0 0 0 0-4.4z"/></symbol>
  <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5h4L13 5v14L8 14.5H4zM16.3 9.1l1.4 1.4 1.4-1.4 1.4 1.4-1.4 1.4 1.4 1.4-1.4 1.4-1.4-1.4-1.4 1.4-1.4-1.4 1.4-1.4-1.4-1.4z"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm16 0h-2V6h-3V4h5zM9 20H4v-5h2v3h3zm6 0v-2h3v-3h2v5z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m12 13.4 5.3 5.3 1.4-1.4-5.3-5.3 5.3-5.3-1.4-1.4L12 10.6 6.7 5.3 5.3 6.7l5.3 5.3-5.3 5.3 1.4 1.4z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 7.5 10.7h-2.2A5.9 5.9 0 1 1 12 6c1.6 0 3 .6 4.1 1.7L13 11h7V4l-2.4 2.4A7.9 7.9 0 0 0 12 4z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 5h6.2l2 2.2H21v12.3H3z"/></symbol>
  <symbol id="i-tv" viewBox="0 0 24 24"><path d="M3 6h18v11H3zM8 19h8v1.6H8z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4 4 12l8 8 1.4-1.4L7.8 13H20z"/></symbol>
</svg>

<header id="header" class="header">
  <div class="header__inner">
    <a class="brand" href="#/home" aria-label="VLCFlix home">
      <span class="brand__vlc">VLC</span><span class="brand__flix">FLIX</span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/home" data-view="home" class="nav__link is-active">Home</a>
      <a href="#/browse" data-view="browse" class="nav__link">Browse All</a>
      <a href="#/mylist" data-view="mylist" class="nav__link">My List</a>
    </nav>
    <div class="header__right">
      <form class="search" id="searchForm" role="search">
        <button type="button" class="search__toggle" id="searchToggle" aria-label="Search">
          <svg><use href="#i-search"/></svg>
        </button>
        <input id="searchInput" class="search__input" type="search" placeholder="Titles, genres, years" aria-label="Search your library" autocomplete="off" />
      </form>
      <button class="engine" id="engineBtn" type="button" title="Where playback happens">
        <span class="engine__dot" id="engineDot"></span>
        <span class="engine__label" id="engineLabel">VLC</span>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
        <svg><use href="#i-gear"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero" id="hero" aria-label="Featured title"></section>

  <div class="rails" id="rails"></div>

  <section class="empty-state" id="emptyState" hidden></section>

  <section class="view" id="browseView" hidden>
    <div class="view__head">
      <h1>Browse All</h1>
      <p id="browseCount" class="view__sub"></p>
    </div>
    <div class="grid" id="browseGrid"></div>
  </section>

  <section class="view" id="mylistView" hidden>
    <div class="view__head">
      <h1>My List</h1>
      <p id="mylistCount" class="view__sub"></p>
    </div>
    <div class="grid" id="mylistGrid"></div>
  </section>

  <section class="view" id="searchView" hidden>
    <div class="view__head">
      <h1 id="searchTitle">Search</h1>
      <p id="searchCount" class="view__sub"></p>
    </div>
    <div class="grid" id="searchGrid"></div>
  </section>
</main>

<footer class="footer">
  <div class="footer__inner">
    <div class="footer__brand"><span class="brand__vlc">VLC</span><span class="brand__flix">FLIX</span></div>
    <p class="footer__note">Browsing front-end for your own media. Playback is handled by VLC through its HTTP control interface, or by the built-in player.</p>
    <p class="footer__meta" id="footerMeta"></p>
  </div>
</footer>

<!-- Detail modal -->
<div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="detail" id="detailBody"></div>
</div>

<!-- Settings modal -->
<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="sheet">
    <div class="sheet__head">
      <h2 id="settingsTitle">Settings</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close settings"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet__body" id="settingsBody"></div>
  </div>
</div>

<!-- Built-in player -->
<div class="player" id="player" hidden>
  <video id="playerVideo" playsinline></video>
  <div class="player__chrome" id="playerChrome">
    <button class="player__back" id="playerClose" type="button" aria-label="Close player"><svg><use href="#i-back"/></svg></button>
    <div class="player__title" id="playerTitle"></div>
    <div class="player__center" id="playerCenter"><svg><use href="#i-play"/></svg></div>
    <div class="player__bottom">
      <input class="player__scrub" id="playerScrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
      <div class="player__controls">
        <button class="icon-btn" id="playerToggle" type="button" aria-label="Play/pause"><svg><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="playerBack10" type="button" aria-label="Back 10 seconds" title="Back 10s">−10</button>
        <button class="icon-btn" id="playerFwd10" type="button" aria-label="Forward 10 seconds" title="Forward 10s">+10</button>
        <span class="player__time" id="playerTime">0:00 / 0:00</span>
        <span class="player__spacer"></span>
        <button class="icon-btn" id="playerMute" type="button" aria-label="Mute"><svg><use href="#i-volume"/></svg></button>
        <input class="player__vol" id="playerVol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
        <button class="icon-btn" id="playerFull" type="button" aria-label="Fullscreen"><svg><use href="#i-expand"/></svg></button>
      </div>
    </div>
  </div>
</div>

<!-- Live VLC remote (appears when VLC is playing) -->
<aside class="remote" id="remote" hidden aria-label="VLC playback controls">
  <div class="remote__art" id="remoteArt"></div>
  <div class="remote__body">
    <div class="remote__top">
      <span class="remote__badge">PLAYING IN VLC</span>
      <button class="icon-btn icon-btn--sm" id="remoteClose" type="button" aria-label="Hide controls"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="remote__title" id="remoteTitle">—</div>
    <input class="remote__scrub" id="remoteScrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek in VLC" />
    <div class="remote__row">
      <span class="remote__time" id="remoteTime">0:00 / 0:00</span>
      <div class="remote__transport">
        <button class="icon-btn icon-btn--sm" id="remoteBack" type="button" aria-label="Back 10s">−10</button>
        <button class="remote__play" id="remoteToggle" type="button" aria-label="Play/pause"><svg><use href="#i-pause"/></svg></button>
        <button class="icon-btn icon-btn--sm" id="remoteFwd" type="button" aria-label="Forward 10s">+10</button>
      </div>
      <span class="remote__vol" id="remoteVol">100%</span>
    </div>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/js/app.js" type="module"></script>
</body>
</html>
